[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "re-portal-backend"
version = "0.1.0"
description = "Real estate investment portal API (FastAPI, MySQL, Redis)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2",
    # aiomysql's caching_sha2_password auth (MySQL 8 default) needs this for the RSA key exchange.
    "cryptography>=43",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

# Only the application package is installable; alembic/, scripts/ and tests/ run from the source tree.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "S", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # ./alembic is the migrations folder, not a package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"scripts/**" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["aiomysql.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # SQLite (tests only) has no native DECIMAL; MySQL does.
    "ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
